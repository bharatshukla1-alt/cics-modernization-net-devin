# MG-01 customer demo: PostgreSQL (Phase 5 schema + seed) -> .NET 9 API -> React UI.
# Start with ./start-demo.sh (creates demo/.env with random local passwords on first run).
name: carddemo-mg01

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: ${CARDDEMO_DB_PASSWORD:?run ./start-demo.sh or set it in demo/.env}
      CARDDEMO_APP_PASSWORD: ${CARDDEMO_APP_PASSWORD:?run ./start-demo.sh or set it in demo/.env}
    volumes:
      - ../../../Artefacts/DDL/MG-01-TransactionTypeMaintenance-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db-init/02-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
      - ../Backend/db/least-privilege-app-role.sql:/docker-entrypoint-initdb.d/sql/least-privilege-app-role.sql:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d carddemo"]
      interval: 3s
      retries: 20

  api:
    build: ../Backend/TransactionTypeService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      Auth__DevBypass: "true"
      AllowedHosts: "localhost;api"
      ConnectionStrings__CardDemo: Host=db;Port=5432;Database=carddemo;Username=carddemo_app;Password=${CARDDEMO_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:5000"

  ui:
    build:
      context: ../Frontend
      dockerfile: Dockerfile.demo
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
    environment:
      API_PROXY_TARGET: http://api:5000
      VITE_AUTH_BYPASS: "true"
    depends_on:
      - api
    ports:
      - "${UI_PORT:-5173}:5173"
